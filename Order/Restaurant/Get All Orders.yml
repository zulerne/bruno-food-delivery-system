info:
  name: Get All Orders
  type: http
  seq: 1

http:
  method: GET
  url: "{{order_url}}/restaurant/orders"
  headers:
    - name: X-Restaurant-ID
      value: "1"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
