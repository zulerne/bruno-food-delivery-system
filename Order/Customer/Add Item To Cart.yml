info:
  name: Add Item To Cart
  type: http
  seq: 2

http:
  method: PUT
  url: "{{order_url}}/cart/items/{{menu_item_id}}"
  headers:
    - name: X-Customer-ID
      value: test
  body:
    type: json
    data: |-
      {
        "restaurant_id": "1",
        "quantity": 1,
        "instructions": ""
      }
  auth: inherit

runtime:
  variables:
    - name: menu_item_id
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
